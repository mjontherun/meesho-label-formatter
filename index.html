<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meesho Shipping Label Formatter</title>

<!-- PDF.js: renders uploaded PDF pages so we can detect/crop whitespace -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs"
          type="module"></script>

  <!-- pdf-lib: creates the final A4 PDF -->
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js">
</script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .container {
      width: min(900px, 94%);
      margin: 40px auto;
    }

    h1 {
      margin-bottom: 8px;
      font-size: 28px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 28px;
    }

    .drop-zone {
      border: 2px dashed #aaa;
      border-radius: 14px;
      background: white;
      padding: 55px 20px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
    }

    .drop-zone.dragover {
      border-color: #333;
      background: #fafafa;
    }

    .drop-zone strong {
      display: block;
      font-size: 18px;
      margin-bottom: 8px;
    }

    .drop-zone span {
      color: #777;
      font-size: 14px;
    }

    #fileInput {
      display: none;
    }

    .controls {
      margin-top: 20px;
      display: flex;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      background: #222;
      color: white;
      padding: 13px 22px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover {
      background: #444;
    }

    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .status {
      margin-top: 20px;
      padding: 14px;
      background: white;
      border-radius: 8px;
      display: none;
      color: #555;
    }

    .preview {
      margin-top: 25px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 15px;
    }

    .preview-item {
      background: white;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .preview-item img {
      width: 100%;
      height: 180px;
      object-fit: contain;
      border: 1px solid #ddd;
      background: #fff;
    }

    .preview-item small {
      display: block;
      margin-top: 7px;
      color: #666;
    }

    .settings {
      margin-top: 20px;
      background: white;
      border-radius: 10px;
      padding: 18px;
    }

    .settings label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
    }

    .settings input[type="number"] {
      width: 70px;
      padding: 7px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>⚡Free Meesho Shipping Label Formatter </h1>

  <div class="subtitle">
    Crop and arrange up to 6 Meesho shipping labels on a single A4 page. Save 70% paper and ink costs without buying an expensive thermal printer!
  </div>

  <div class="drop-zone" id="dropZone">
    <strong>Drag & Drop your PDF here</strong>
    <span>or click to choose a PDF file</span>
    <input type="file" id="fileInput" accept="application/pdf,.pdf">
  </div>

  <div class="settings">
    <label>
      Whitespace detection threshold:
      <input
        type="number"
        id="threshold"
        value="245"
        min="150"
        max="255"
      >
      <span>/ 255</span>
    </label>
  </div>

  <div class="controls">
    <button id="generateBtn" disabled>Create A4 PDF</button>
    <button id="clearBtn" disabled>Clear</button>
  </div>

  <div class="status" id="status"></div>

  <div class="preview" id="preview"></div>

</div>

<script type="module">

  /*
   * PDF.js is used only to render the uploaded PDF pages.
   * pdf-lib is used to create the final A4 PDF.
   */
  import * as pdfjsLib from
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs";

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";

  const { PDFDocument } = PDFLib;

  const dropZone = document.getElementById("dropZone");
  const fileInput = document.getElementById("fileInput");
  const generateBtn = document.getElementById("generateBtn");
  const clearBtn = document.getElementById("clearBtn");
  const statusBox = document.getElementById("status");
  const preview = document.getElementById("preview");
  const thresholdInput = document.getElementById("threshold");

  let croppedLabels = [];

  /*
   * Open file picker.
   */
  dropZone.addEventListener("click", () => {
    fileInput.click();
  });

  fileInput.addEventListener("change", event => {
    const file = event.target.files[0];

    if (file) {
      processPDF(file);
    }
  });

  /*
   * Drag and drop.
   */
  dropZone.addEventListener("dragover", event => {
    event.preventDefault();
    dropZone.classList.add("dragover");
  });

  dropZone.addEventListener("dragleave", () => {
    dropZone.classList.remove("dragover");
  });

  dropZone.addEventListener("drop", event => {
    event.preventDefault();
    dropZone.classList.remove("dragover");

    const file = event.dataTransfer.files[0];

    if (!file) return;

    if (
      file.type !== "application/pdf" &&
      !file.name.toLowerCase().endsWith(".pdf")
    ) {
      showStatus("Please upload a PDF file.");
      return;
    }

    processPDF(file);
  });

  /*
   * Status message.
   */
  function showStatus(message) {
    statusBox.style.display = "block";
    statusBox.textContent = message;
  }

  /*
   * Render one PDF page to a canvas.
   */
  async function renderPDFPage(page, scale = 2.0) {

    const viewport = page.getViewport({ scale });

    const canvas = document.createElement("canvas");

    const context = canvas.getContext("2d", {
      willReadFrequently: true
    });

    canvas.width = Math.ceil(viewport.width);
    canvas.height = Math.ceil(viewport.height);

    await page.render({
      canvasContext: context,
      viewport: viewport
    }).promise;

    return canvas;
  }

  /*
   * Detect the smallest rectangle containing
   * non-white content.
   */
  function findContentBounds(canvas) {

    const ctx = canvas.getContext("2d", {
      willReadFrequently: true
    });

    const width = canvas.width;
    const height = canvas.height;

    const imageData = ctx.getImageData(
      0,
      0,
      width,
      height
    );

    const data = imageData.data;

    const threshold =
      Number(thresholdInput.value) || 245;

    let minX = width;
    let minY = height;
    let maxX = -1;
    let maxY = -1;

    for (let y = 0; y < height; y++) {

      for (let x = 0; x < width; x++) {

        const index = (y * width + x) * 4;

        const r = data[index];
        const g = data[index + 1];
        const b = data[index + 2];
        const a = data[index + 3];

        if (
          a > 10 &&
          (
            r < threshold ||
            g < threshold ||
            b < threshold
          )
        ) {

          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
        }
      }
    }

    /*
     * Blank page.
     */
    if (maxX === -1) {
      return {
        x: 0,
        y: 0,
        width,
        height
      };
    }

    /*
     * Small safety padding prevents content
     * touching the detected boundary from
     * being clipped.
     */
    const padding = 3;

    minX = Math.max(0, minX - padding);
    minY = Math.max(0, minY - padding);
    maxX = Math.min(width - 1, maxX + padding);
    maxY = Math.min(height - 1, maxY + padding);

    return {
      x: minX,
      y: minY,
      width: maxX - minX + 1,
      height: maxY - minY + 1
    };
  }

  /*
   * Crop a canvas.
   */
  function cropCanvas(canvas, bounds) {

    const cropped = document.createElement("canvas");

    cropped.width = bounds.width;
    cropped.height = bounds.height;

    const ctx = cropped.getContext("2d");

    ctx.fillStyle = "#ffffff";

    ctx.fillRect(
      0,
      0,
      cropped.width,
      cropped.height
    );

    ctx.drawImage(
      canvas,
      bounds.x,
      bounds.y,
      bounds.width,
      bounds.height,
      0,
      0,
      bounds.width,
      bounds.height
    );

    return cropped;
  }

  /*
   * Convert canvas to PNG bytes.
   */
  async function canvasToBytes(canvas) {

    const blob = await new Promise(resolve => {
      canvas.toBlob(
        resolve,
        "image/png"
      );
    });

    return new Uint8Array(
      await blob.arrayBuffer()
    );
  }

  /*
   * Process uploaded PDF.
   */
  async function processPDF(file) {

    try {

      croppedLabels = [];

      preview.innerHTML = "";

      generateBtn.disabled = true;
      clearBtn.disabled = true;

      showStatus("Loading PDF...");

      const arrayBuffer =
        await file.arrayBuffer();

      const pdf =
        await pdfjsLib.getDocument({
          data: arrayBuffer
        }).promise;

      showStatus(
        `Found ${pdf.numPages} label page(s). Processing...`
      );

      for (
        let pageNumber = 1;
        pageNumber <= pdf.numPages;
        pageNumber++
      ) {

        showStatus(
          `Processing label ${pageNumber} of ${pdf.numPages}...`
        );

        const page =
          await pdf.getPage(pageNumber);

        const canvas =
          await renderPDFPage(page, 2.0);

        const bounds =
          findContentBounds(canvas);

        const cropped =
          cropCanvas(canvas, bounds);

        const pngBytes =
          await canvasToBytes(cropped);

        croppedLabels.push({
          bytes: pngBytes,
          width: cropped.width,
          height: cropped.height
        });

        /*
         * Preview.
         */
        const previewItem =
          document.createElement("div");

        previewItem.className =
          "preview-item";

        const img =
          document.createElement("img");

        img.src =
          cropped.toDataURL("image/png");

        const caption =
          document.createElement("small");

        caption.textContent =
          `Label ${pageNumber}`;

        previewItem.appendChild(img);
        previewItem.appendChild(caption);

        preview.appendChild(previewItem);
      }

      const numberOfA4Pages =
        Math.ceil(croppedLabels.length / 6);

      showStatus(
        `Ready: ${croppedLabels.length} labels → ` +
        `${numberOfA4Pages} A4 page(s).`
      );

      generateBtn.disabled =
        croppedLabels.length === 0;

      clearBtn.disabled = false;

    } catch (error) {

      console.error(error);

      showStatus(
        "Could not process the PDF. " +
        "Please make sure it is a valid PDF."
      );
    }
  }

  /*
   * Create final A4 PDF.
   */
  generateBtn.addEventListener(
    "click",
    async () => {

      if (!croppedLabels.length) return;

      try {

        generateBtn.disabled = true;

        showStatus(
          "Creating printable A4 PDF..."
        );

        const outputPDF =
          await PDFDocument.create();

        /*
         * A4 dimensions in PDF points.
         * 210 × 297 mm
         * = 595.28 × 841.89 pt
         */
        const A4_WIDTH = 595.28;
        const A4_HEIGHT = 841.89;

        /*
         * Outer A4 margins.
         */
        const margin = 5;

        /*
         * Gap between labels.
         */
        const gap = 6;

        /*
         * 2 columns × 3 rows.
         */
        const columns = 2;
        const rows = 3;

        /*
         * Available area after margins and gaps.
         */
        const availableWidth =
          A4_WIDTH -
          margin * 2 -
          gap * (columns - 1);

        const availableHeight =
          A4_HEIGHT -
          margin * 2 -
          gap * (rows - 1);

        const cellWidth =
          availableWidth / columns;

        const cellHeight =
          availableHeight / rows;

        /*
         * Six labels per A4 page.
         */
        for (
          let start = 0;
          start < croppedLabels.length;
          start += 6
        ) {

          const page =
            outputPDF.addPage([
              A4_WIDTH,
              A4_HEIGHT
            ]);

          const labelsOnPage =
            croppedLabels.slice(
              start,
              start + 6
            );

          for (
            let i = 0;
            i < labelsOnPage.length;
            i++
          ) {

            const label =
              labelsOnPage[i];

            const image =
              await outputPDF.embedPng(
                label.bytes
              );

            /*
             * Preserve the original label aspect ratio.
             */
            const imageRatio =
              label.width / label.height;

            /*
             * Fit label inside its grid cell.
             */
            let drawWidth = cellWidth;
            let drawHeight =
              drawWidth / imageRatio;

            if (drawHeight > cellHeight) {

              drawHeight =
                cellHeight;

              drawWidth =
                drawHeight * imageRatio;
            }

            /*
             * Grid coordinates.
             */
            const column =
              i % columns;

            const row =
              Math.floor(i / columns);

            /*
             * Cell position.
             *
             * The reference layout uses almost the
             * entire A4 sheet: 2 columns × 3 rows,
             * with only a very small outside margin
             * and narrow gaps between labels.
             */
            const cellX =
              margin +
              column * (cellWidth + gap);

            const cellY =
              A4_HEIGHT -
              margin -
              (row + 1) * cellHeight -
              row * gap;

            /*
             * Center the cropped label inside its cell.
             * This keeps the label's aspect ratio intact
             * and, importantly, keeps every part of the
             * label inside the A4 page.
             */
            const x =
              cellX +
              (cellWidth - drawWidth) / 2;

            const y =
              cellY +
              (cellHeight - drawHeight) / 2;

            page.drawImage(image, {
              x,
              y,
              width: drawWidth,
              height: drawHeight
            });
          }
        }

        /*
         * Save PDF.
         */
        const pdfBytes =
          await outputPDF.save();

        /*
         * Browser download.
         */
        const blob =
          new Blob(
            [pdfBytes],
            { type: "application/pdf" }
          );

        const url =
          URL.createObjectURL(blob);

        const link =
          document.createElement("a");

        link.href = url;
        link.download =
          "meesho-labels-A4.pdf";

        document.body.appendChild(link);

        link.click();

        link.remove();

        URL.revokeObjectURL(url);

        showStatus(
          `Done! ${croppedLabels.length} labels ` +
          `were arranged into ` +
          `${Math.ceil(croppedLabels.length / 6)} A4 page(s).`
        );

        generateBtn.disabled = false;

      } catch (error) {

        console.error(error);

        showStatus(
          "Something went wrong while creating the A4 PDF."
        );

        generateBtn.disabled = false;
      }
    }
  );

  /*
   * Clear everything.
   */
  clearBtn.addEventListener(
    "click",
    () => {

      croppedLabels = [];

      preview.innerHTML = "";

      fileInput.value = "";

      generateBtn.disabled = true;
      clearBtn.disabled = true;

      statusBox.style.display = "none";
    }
  );

</script>

</body>
</html>
